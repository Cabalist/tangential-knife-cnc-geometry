[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "utl-geom2d"
version = "1.0.0"
description = "2D geometry kernel for turning SVG paths into cutting toolpaths: points, lines, circular arcs, cubic Béziers, biarcs, tangent continuity"
readme = "README.rst"
requires-python = ">=3.14"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Jarvis", email = "ryan@technoloft.com" }]
maintainers = [{ name = "Ryan Jarvis", email = "ryan@technoloft.com" }]
keywords = ["2d", "geometry", "bezier", "biarc", "toolpath", "gcode"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
# Pure standard library. No runtime dependencies.
dependencies = []

[project.urls]
repository = "https://github.com/Cabalist/utl-geom2d"

[dependency-groups]
dev = [
    "prek",
    "pyrefly",
    "pytest",
    "pytest-randomly",
    "pytest-xdist",
    "ruff",
    "ty",
]
docs = [
    "sphinx",
    "sphinx-autobuild",
    "furo",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["geom2d*"]

[tool.setuptools.package-data]
geom2d = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-n", "auto", "--dist=loadscope", "-ra"]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "ANN",    # annotations everywhere
    "RUF",
    "PTH",
    "PIE",
    "PERF",
    "PGH",
    "G",
    "TID",
    "PT",
    "RET",
    "ARG",
    "TRY",
    "PL",
    "DTZ",
    "T20",
    "ISC",
    "TC",
    "FBT",    # booleans are keyword-only
    "N",      # pep8 naming
    "A",      # no shadowed builtins
    "ERA",    # no commented-out code
    "S101",   # no assert in library code (tests may assert; see per-file-ignores)
    "C90",    # cyclomatic complexity (default limit 10)
]
ignore = [
    "E501",    # line too long (handled by the formatter)
    "PERF401",
    "PERF403",
    "PLR0912", # geometric algorithms are long by nature
    "PLR0913", # geometry constructors take positional coordinates
    "PLR0915",
    "PLR0917",
    "PLR2004", # geometry constants (0.5, 2.0, pi/2) are not magic
    "TRY003",
]
per-file-ignores = { "tests/**" = ["ANN", "PLR2004", "ARG001", "S101"] }

[tool.ruff.lint.isort]
known-first-party = ["geom2d"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.14"
# "." resolves the `tests` package so shared test helpers import as `tests.*`.
root = ["./src", "."]

[tool.ty.rules]
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
redundant-cast = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"

[tool.pyrefly]
min-severity = "warn"
project-includes = ["src", "tests"]
python-version = "3.14"
search-path = ["src", "."]
preset = "strict"

[tool.pyrefly.errors]
redundant-cast = "error"
# P.of() normalises foreign numeric types with explicit float() calls.
unnecessary-type-conversion = "ignore"
